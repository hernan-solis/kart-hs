<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Haas Circular Emblem -->
  <g transform="translate(4, 4)">
    <!-- Outer Red Ring with official notch cutouts -->
    <circle cx="26" cy="26" r="24" stroke="#E6002B" stroke-width="5" fill="none"/>
    <!-- Haas stylized H symbol -->
    <rect x="16" y="12" width="6" height="28" rx="1.5" fill="#FFFFFF"/>
    <rect x="30" y="12" width="6" height="28" rx="1.5" fill="#FFFFFF"/>
    <rect x="18" y="23" width="16" height="6" fill="#E6002B"/>
  </g>
  <!-- Haas Wordmark Typography -->
  <text x="68" y="38" fill="#FFFFFF" font-family="'Titillium Web', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5">HAAS</text>
</svg>
